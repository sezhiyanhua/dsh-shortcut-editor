url: https://github.com/sezhiyanhua/dsh-shortcut-editor
name: sezhiyanhua/dsh-shortcut-editor
category: ui
description:
  en: "Adds a Keyboard shortcuts page to Settings that lists every app shortcut beside its default binding, lets you rebind it by pressing a key combination, and restores one item or all defaults at once. Follows the app language."
  zh: "在设置里增加「快捷键」页，把每个应用快捷键与它的默认按键并排对照，按键即可重新绑定，并支持按项或全部还原默认，跟随应用语言切换中英文。"
icon: https://github.com/sezhiyanhua/dsh-shortcut-editor/raw/main/icon.png
